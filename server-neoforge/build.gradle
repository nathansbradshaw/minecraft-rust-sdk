plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.minecraftsdk'
version = '0.1.0-alpha.11'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.233'
    mods { minecraft_sdk { sourceSet sourceSets.main } }
    runs { server { server(); programArgument '--nogui'; gameDirectory = file('run') } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.named('processResources') {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version:project.version) }
}
tasks.named('jar') { from('../LICENSE') }
