[package]
name = "my-minecraft-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]
resolver = "3"

[dependencies]
minecraft-sdk = { path = "/opt/minecraft-sdk/crates/sdk" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0
incremental = false
