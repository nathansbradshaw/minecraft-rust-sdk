# Minimal workspace for building with the coding container's own libc/toolchain.
# Place at the root beside crates/{brain,core,sdk}; reuse its existing target.
[workspace]
members = ["crates/brain", "crates/core", "crates/sdk"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nathansbradshaw/minecraft-rust-sdk"

[workspace.dependencies]
minecraft-sdk-core = { path = "crates/core" }
minecraft-sdk = { path = "crates/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[profile.dev.package.minecraft-sdk-brain]
opt-level = 2
